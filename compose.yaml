services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  api:
    build: .
    image: blk-hacking-ind-retirement-savings
    ports:
      - "5477:5477"       # direct access for Swagger / testing
    expose:
      - "5477"
    environment:
      - PYTHONOPTIMIZE=1
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=60
      - REDIS_POOL_SIZE=50
      - L1_CACHE_MAXSIZE=4096
    depends_on:
      - redis
    deploy:
      replicas: 1           # replicas > 1 conflicts with ports mapping; scale via nginx
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Only safe sysctls allowed in unprivileged containers
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_keepalive_time: 60
      net.ipv4.tcp_keepalive_intvl: 10
      net.ipv4.tcp_keepalive_probes: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5477/blackrock/challenge/v1/performance"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --hz 100
      --tcp-backlog 511
      --tcp-keepalive 60
      --save ""
      --appendonly no
      --lazyfree-lazy-eviction yes
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
